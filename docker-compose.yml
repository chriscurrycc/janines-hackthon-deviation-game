# Two services: the Next.js web app and the realtime WebSocket service.
# Put OPENAI_API_KEY + OPENAI_MODEL in a sibling .env file (see .env.example).
services:
  web:
    image: deviation-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      - REALTIME_INTERNAL_URL=http://realtime:7243
    # Bind to localhost only — nginx is the public entrypoint.
    ports:
      - "127.0.0.1:7242:7242"
    restart: unless-stopped

  realtime:
    image: deviation-realtime:latest
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:7243:7243"
    restart: unless-stopped
