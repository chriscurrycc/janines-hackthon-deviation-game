# Sample nginx for your private server. Routes /ws to the realtime service (with the
# WebSocket upgrade headers it needs) and everything else to the Next.js web app.
# Assumes docker compose published web on 127.0.0.1:7242 and realtime on 127.0.0.1:7243.

server {
    listen 80;
    server_name deviation.example.com;

    # Realtime WebSocket — MUST forward the upgrade headers or multiplayer breaks.
    location /ws {
        proxy_pass http://127.0.0.1:7243;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # keep long-lived game connections alive
    }

    # Next.js web app (UI + /api/guess for solo mode).
    location / {
        proxy_pass http://127.0.0.1:7242;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
